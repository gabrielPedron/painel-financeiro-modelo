# Roda os testes e o build a cada pull request e a cada mudança na main.
# ponytail: sem lint (8.700 erros de formatação herdados); entra depois de um `bun run format`.
name: testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build

  # A base de partida dos mentorados (base/LEIAME.md) tem que continuar saindo limpa:
  # sem nada nosso dentro, com o banco subindo do zero e com testes e build passando.
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: node scripts/gerar-base.mjs --saida ../base-financeiro
      - run: node scripts/ensaio-base.mjs ../base-financeiro
      - run: bun install --frozen-lockfile && bun run test && bun run build
        working-directory: ../base-financeiro
      - run: node scripts/gerar-base.mjs --conferir ../base-financeiro
